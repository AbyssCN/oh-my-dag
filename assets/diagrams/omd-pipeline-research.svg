<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="pipeline-research-title pipeline-research-desc">
  <title id="pipeline-research-title">The deep-research pipeline</title>
  <desc id="pipeline-research-desc">A four-stage research pipeline where each stage runs on a different model, and the fetch step runs with no model at all.</desc>
  <defs>
    <marker id="pr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6f6558"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="#faf8f5"/>

  <text x="60" y="40" fill="#918878" font-size="8" font-weight="500" letter-spacing="0.18em"
        font-family="'Geist Mono', ui-monospace, monospace">IN · ONE QUESTION</text>
  <text x="940" y="40" fill="#918878" font-size="8" font-weight="500" letter-spacing="0.18em"
        text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace">OUT · REPORT + FULL CORPUS</text>

  <line x1="256" y1="132" x2="284" y2="132" stroke="#6f6558" stroke-width="1" marker-end="url(#pr-arrow)"/>
  <line x1="484" y1="132" x2="512" y2="132" stroke="#6f6558" stroke-width="1" marker-end="url(#pr-arrow)"/>
  <line x1="712" y1="132" x2="740" y2="132" stroke="#6f6558" stroke-width="1" marker-end="url(#pr-arrow)"/>

  <!-- 01 GATHER — focal -->
  <rect x="60" y="64" width="196" height="136" rx="6" fill="rgba(179,56,42,0.08)" stroke="#b3382a" stroke-width="1.2"/>
  <rect x="72" y="76" width="28" height="16" rx="4" fill="none" stroke="rgba(179,56,42,0.5)" stroke-width="0.8"/>
  <text x="86" y="88" fill="#b3382a" font-size="8" font-weight="600" text-anchor="middle"
        font-family="'Geist Mono', ui-monospace, monospace">01</text>
  <text x="72" y="120" fill="#140f0a" font-size="14" font-weight="600"
        font-family="'Geist', system-ui, sans-serif">Gather</text>
  <text x="72" y="144" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">seed angles → fetch → distil</text>
  <text x="72" y="160" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">full text to disk, index back</text>
  <line x1="72" y1="172" x2="244" y2="172" stroke="rgba(20,15,10,0.12)" stroke-width="0.8"/>
  <text x="72" y="188" fill="#b3382a" font-size="9" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">fetch step · no model in it</text>

  <!-- 02 SYNTHESIZE -->
  <rect x="288" y="64" width="196" height="136" rx="6" fill="#ffffff" stroke="#140f0a" stroke-width="1"/>
  <rect x="300" y="76" width="28" height="16" rx="4" fill="none" stroke="rgba(20,15,10,0.4)" stroke-width="0.8"/>
  <text x="314" y="88" fill="#140f0a" font-size="8" font-weight="600" text-anchor="middle"
        font-family="'Geist Mono', ui-monospace, monospace">02</text>
  <text x="300" y="120" fill="#140f0a" font-size="14" font-weight="600"
        font-family="'Geist', system-ui, sans-serif">Synthesize</text>
  <text x="300" y="144" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one lens each, in parallel</text>
  <text x="300" y="160" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">judge panel picks a champion</text>
  <line x1="300" y1="172" x2="472" y2="172" stroke="rgba(20,15,10,0.12)" stroke-width="0.8"/>
  <text x="300" y="188" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">mimo-v2.5-pro · 54 calls</text>

  <!-- 03 DEEPEN -->
  <rect x="516" y="64" width="196" height="136" rx="6" fill="#ffffff" stroke="#140f0a" stroke-width="1"/>
  <rect x="528" y="76" width="28" height="16" rx="4" fill="none" stroke="rgba(20,15,10,0.4)" stroke-width="0.8"/>
  <text x="542" y="88" fill="#140f0a" font-size="8" font-weight="600" text-anchor="middle"
        font-family="'Geist Mono', ui-monospace, monospace">03</text>
  <text x="528" y="120" fill="#140f0a" font-size="14" font-weight="600"
        font-family="'Geist', system-ui, sans-serif">Deepen</text>
  <text x="528" y="144" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">find gaps → re-crawl them</text>
  <text x="528" y="160" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rounds counted by the engine</text>
  <line x1="528" y1="172" x2="700" y2="172" stroke="rgba(20,15,10,0.12)" stroke-width="0.8"/>
  <text x="528" y="188" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">kimi-k3 · 7 calls</text>

  <!-- 04 FINISH -->
  <rect x="744" y="64" width="196" height="136" rx="6" fill="#ffffff" stroke="#140f0a" stroke-width="1"/>
  <rect x="756" y="76" width="28" height="16" rx="4" fill="none" stroke="rgba(20,15,10,0.4)" stroke-width="0.8"/>
  <text x="770" y="88" fill="#140f0a" font-size="8" font-weight="600" text-anchor="middle"
        font-family="'Geist Mono', ui-monospace, monospace">04</text>
  <text x="756" y="120" fill="#140f0a" font-size="14" font-weight="600"
        font-family="'Geist', system-ui, sans-serif">Finish</text>
  <text x="756" y="144" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">merge champions, graft the</text>
  <text x="756" y="160" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">runner-up&#8217;s best passages</text>
  <line x1="756" y1="172" x2="928" y2="172" stroke="rgba(20,15,10,0.12)" stroke-width="0.8"/>
  <text x="756" y="188" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">gpt-5.6-sol · 9 calls</text>

  <text x="60" y="236" fill="#6f6558" font-size="11" font-family="'Geist', system-ui, sans-serif">Four stages, four different models — and the step that decides fact coverage has no model in it at all.</text>

  <line x1="60" y1="268" x2="940" y2="268" stroke="rgba(20,15,10,0.12)" stroke-width="0.8"/>
  <text x="60" y="288" fill="#918878" font-size="8" font-weight="500" letter-spacing="0.14em"
        font-family="'Geist Mono', ui-monospace, monospace">LEGEND</text>
  <rect x="160" y="278" width="16" height="12" rx="3" fill="rgba(179,56,42,0.08)" stroke="#b3382a" stroke-width="1"/>
  <text x="184" y="288" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">deterministic · zero LLM</text>
  <rect x="380" y="278" width="16" height="12" rx="3" fill="#ffffff" stroke="#140f0a" stroke-width="1"/>
  <text x="404" y="288" fill="#6f6558" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model stage · seat named below</text>
  <text x="660" y="288" fill="#918878" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">swap any seat: --lens-model · --reason-model</text>
</svg>
