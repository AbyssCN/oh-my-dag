<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="1240" height="1010" data-generator="fireworks-tech-graph" data-schema-version="1" data-style-id="3" data-visual-theme="Blueprint" data-diagram-type="architecture">
  <style>
    text { font-family: 'Courier New', 'Lucida Console', 'Microsoft YaHei', 'SimHei', monospace; fill: #caf0f8; }
    .title  { font-size: 26px; font-weight: 700; fill: #ffffff; letter-spacing: 0.06em; }
    .sub    { font-size: 15px; fill: #48cae4; }
    .band   { font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: 0.05em; }
    .bandcn { font-size: 14px; fill: #48cae4; }
    .box    { font-size: 16px; fill: #caf0f8; }
    .hdr    { font-size: 17px; font-weight: 700; fill: #ffffff; letter-spacing: 0.05em; }
    .hdrg   { font-size: 17px; font-weight: 700; fill: #06d6a0; letter-spacing: 0.05em; }
    .ann    { font-size: 13.5px; fill: #90e0ef; }
    .warn   { font-size: 13.5px; fill: #f77f00; }
    .ok     { font-size: 13.5px; fill: #06d6a0; }
    .rail   { font-size: 16px; font-weight: 700; fill: #caf0f8; letter-spacing: 0.05em; }
    .chip   { font-size: 13.5px; fill: #90e0ef; }
  </style>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/>
    </pattern>
    <marker id="ac" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#00b4d8"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#06d6a0"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f77f00"/>
    </marker>
  </defs>

  <rect width="1240" height="1010" fill="#0a1628"/>
  <rect width="1240" height="1010" fill="url(#grid)" opacity="0.6"/>

  <text class="title" x="60" y="42">OH-MY-DAG — WHERE IT SITS</text>
  <text class="sub"   x="60" y="66">reliability comes from outside the model · creativity comes from inside it</text>

  <!-- ===== BAND 1 — session layer ===== -->
  <rect x="60" y="88" width="1120" height="176" rx="2" fill="none" stroke="#00b4d8" stroke-width="1" stroke-dasharray="6,3"/>
  <text class="band"   x="80" y="118">① SESSION LAYER</text>
  <text class="bandcn" x="292" y="118">会话层 — unit of work: a turn · verdict: the model says so</text>

  <rect x="80"  y="134" width="200" height="42" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text class="box" x="180" y="161" text-anchor="middle">Claude Code</text>
  <rect x="292" y="134" width="200" height="42" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text class="box" x="392" y="161" text-anchor="middle">Codex</text>
  <rect x="504" y="134" width="200" height="42" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text class="box" x="604" y="161" text-anchor="middle">gemini-cli</text>
  <rect x="716" y="134" width="200" height="42" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text class="box" x="816" y="161" text-anchor="middle">opencode</text>
  <rect x="928" y="134" width="232" height="42" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1" stroke-dasharray="6,3"/>
  <text class="box" x="1044" y="161" text-anchor="middle">any MCP client</text>

  <rect x="80" y="192" width="1080" height="56" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1"/>
  <text class="hdrg" x="98" y="216">omd has its own front doors too</text>
  <text class="ann"  x="98" y="238">conductor_chat — a persistent conductor session over MCP, drivable from a phone · omd tui — omd's own terminal client (in dev)</text>

  <line x1="620" y1="264" x2="620" y2="288" stroke="#00b4d8" stroke-width="1" marker-end="url(#ac)"/>
  <rect x="452" y="290" width="336" height="38" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <text class="rail" x="620" y="315" text-anchor="middle">MCP · stdio · 50 tools</text>
  <text class="ann"  x="806" y="308">run · solve · map_* · conductor_chat</text>
  <text class="ann"  x="806" y="326">one engine, called from whatever you already use</text>
  <line x1="620" y1="328" x2="620" y2="352" stroke="#00b4d8" stroke-width="1" marker-end="url(#ac)"/>

  <!-- ===== BAND 2 — orchestration ===== -->
  <rect x="60" y="354" width="1120" height="392" rx="2" fill="none" stroke="#00b4d8" stroke-width="1.5"/>
  <text class="band"   x="80" y="384">② ORCHESTRATION LAYER · omd</text>
  <text class="bandcn" x="480" y="384">编排层 — unit of work: a node · verdict: from outside the model</text>

  <rect x="80" y="400" width="300" height="200" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="80" y1="430" x2="380" y2="430" stroke="#00b4d8" stroke-width="0.8"/>
  <text class="hdr" x="96" y="422">WHERE THE GRAPH COMES FROM</text>
  <text class="ann" x="96" y="454">a conductor draws it</text>
  <text class="ok"  x="96" y="480">an SDD contract compiles to it</text>
  <text class="ann" x="110" y="498">zero LLM · flat · no re-plan</text>
  <text class="ok"  x="96" y="524">a decision map compiles to it</text>
  <text class="ann" x="110" y="542">zero LLM · ruled tickets + edges</text>
  <text class="ann" x="96" y="568">you hand-write it</text>
  <text class="ann" x="96" y="586">one model per node — see below</text>

  <line x1="380" y1="500" x2="400" y2="500" stroke="#00b4d8" stroke-width="1.2" marker-end="url(#ac)"/>

  <rect x="402" y="400" width="270" height="200" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="402" y1="430" x2="672" y2="430" stroke="#00b4d8" stroke-width="0.8"/>
  <text class="hdr" x="418" y="422">TYPED PLAN → PASSES</text>
  <text class="box" x="418" y="456">{ nodes[], outputs[] }</text>
  <text class="ann" x="418" y="474">zod-validated — the seam.</text>
  <text class="ann" x="418" y="504">prune — drop dead nodes</text>
  <text class="ann" x="418" y="524">dedup — merge by semantic key</text>
  <text class="ann" x="418" y="544">evidence — claims need sources</text>
  <text class="ann" x="418" y="564">stamp — pin a model per node</text>
  <text class="ok"  x="418" y="586">four pure functions · zero LLM</text>

  <line x1="672" y1="500" x2="692" y2="500" stroke="#00b4d8" stroke-width="1.2" marker-end="url(#ac)"/>

  <rect x="694" y="400" width="230" height="200" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="694" y1="430" x2="924" y2="430" stroke="#00b4d8" stroke-width="0.8"/>
  <text class="hdr" x="710" y="422">EXECUTE</text>
  <text class="ann" x="710" y="454">ready-set scheduling,</text>
  <text class="ann" x="710" y="472">concurrent fan-out</text>
  <rect x="710" y="484" width="206" height="26" rx="2" fill="none" stroke="#48cae4" stroke-width="0.8"/>
  <text class="chip" x="720" y="502">agent leaf — real tools</text>
  <rect x="710" y="516" width="206" height="26" rx="2" fill="none" stroke="#48cae4" stroke-width="0.8"/>
  <text class="chip" x="720" y="534">command leaf — zero LLM</text>
  <rect x="710" y="548" width="206" height="26" rx="2" fill="none" stroke="#48cae4" stroke-width="0.8"/>
  <text class="chip" x="720" y="566">map node — runtime list</text>
  <text class="ann" x="710" y="590">the engine owns the loop</text>

  <line x1="924" y1="500" x2="944" y2="500" stroke="#06d6a0" stroke-width="1.2" marker-end="url(#ag)"/>

  <rect x="946" y="400" width="214" height="200" rx="2" fill="#0d1f3c" stroke="#06d6a0" stroke-width="1.2"/>
  <line x1="946" y1="430" x2="1160" y2="430" stroke="#06d6a0" stroke-width="0.8"/>
  <text class="hdr" x="962" y="422">VERDICT</text>
  <text class="ann" x="962" y="452">a ladder. no skipping.</text>
  <text class="ok"  x="962" y="480">① mechanical oracle</text>
  <text class="ann" x="962" y="498">exit code · write-set</text>
  <text class="ok"  x="962" y="524">② cross-family verifier</text>
  <text class="ann" x="962" y="542">not the author's family</text>
  <text class="ok"  x="962" y="568">③ a human</text>
  <text class="ann" x="962" y="586">no defer, no going solo</text>

  <polyline points="1053,600 1053,626 230,626 230,602" fill="none" stroke="#f77f00" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text class="warn" x="300" y="620">fail → escalate: stronger conductor, re-plan, re-run only the rejected nodes</text>

  <rect x="80" y="640" width="1080" height="90" rx="2" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="80" y1="670" x2="1160" y2="670" stroke="#00b4d8" stroke-width="0.8"/>
  <text class="hdr" x="98" y="662">PIPELINES THAT SHIP — 22 skills, and each one is a graph, not a prompt</text>
  <text class="ann" x="98" y="694">/omd-grill → /omd-contract → solve --sddPath · /omd-research-deep · /omd-council · /omd-review · /omd-debug · /omd-slim</text>
  <text class="ann" x="98" y="716">a prompt can only ask the model in front of you to behave differently. these pick a model per node and put a gate on the end.</text>

  <!-- ===== BAND 3 — what persists ===== -->
  <rect x="60" y="762" width="1120" height="106" rx="2" fill="none" stroke="#00b4d8" stroke-width="1" stroke-dasharray="6,3"/>
  <text class="band"   x="80" y="792">③ WHAT OUTLIVES THE RUN</text>
  <text class="bandcn" x="404" y="792">the memory a context window does not have</text>
  <text class="ok"  x="98" y="820">decision map — typed tickets in git</text>
  <text class="ann" x="98" y="840">research / grill / prototype / task · blockedBy edges</text>
  <text class="ann" x="98" y="858">a ruled region compiles straight to a graph</text>
  <text class="ok"  x="640" y="820">per-node checkpoints</text>
  <text class="ann" x="640" y="840">atomic on disk · resume re-checks</text>
  <text class="ann" x="640" y="858">hashes, re-bills only what changed</text>
  <text class="ok"  x="960" y="820">fact store</text>
  <text class="ann" x="960" y="840">hybrid recall, both legs</text>
  <text class="ann" x="960" y="858">zero-model</text>

  <!-- ===== BAND 4 — model layer ===== -->
  <rect x="60" y="884" width="1120" height="96" rx="2" fill="none" stroke="#00b4d8" stroke-width="1" stroke-dasharray="6,3"/>
  <text class="band"   x="80" y="914">④ MODEL LAYER</text>
  <text class="bandcn" x="270" y="914">18 seats — bring your own models, anything OpenAI-compatible</text>
  <text class="ann" x="98" y="940">conductor · leaf · agent · judge · verifier · review · lens · distill · gate · reason · reduce · fusion · graft · expand …</text>
  <text class="ok"  x="98" y="964">node.model &gt; template.model &gt; auto-assign — a model you pin by hand is never overwritten. this is how you build your own pipeline.</text>
</svg>
